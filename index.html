<script>
(() => {
  const map=L.map('map',{zoomControl:true}).setView([36.2,138.2],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const groups={sukiya:L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:55}),be:L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:55})};
  const colors={sukiya:'#e53935',be:'#1565c0'};
  let circle=null,centerMarker=null,filtered=[];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const icon=type=>L.divIcon({className:'',html:`<span style="display:block;width:14px;height:14px;border:2px solid white;border-radius:50%;background:${colors[type]};box-shadow:0 1px 4px rgba(0,0,0,.45)"></span>`,iconSize:[14,14],iconAnchor:[7,7]});
  const markerById=new Map();
  STORES.forEach(s=>{const m=L.marker([s.lat,s.lon],{icon:icon(s.type),title:s.name});m.bindPopup(`<div class="popup-name">${esc(s.name)}</div><div class="popup-address">${esc(s.address)}</div><button class="popup-center" type="button" data-center-id="${s.id}">この店舗を中心にする</button>`);markerById.set(s.id,m);});
  map.on('popupopen',e=>{const b=e.popup.getElement().querySelector('[data-center-id]');if(b)b.addEventListener('click',()=>setCenter(STORES.find(s=>s.id===b.dataset.centerId)));});
  function setCenter(s){$('centerStore').value=`${s.name}｜${s.address}`;$('lat').value=s.lat;$('lon').value=s.lon;drawRadius();}
  function apply(){const pref=$('pref').value,showS=$('showSukiya').checked,showB=$('showBE').checked;groups.sukiya.clearLayers();groups.be.clearLayers();filtered=STORES.filter(s=>(s.type==='sukiya'?showS:showB)&&(!pref||s.pref===pref));filtered.forEach(s=>groups[s.type].addLayer(markerById.get(s.id)));Object.values(groups).forEach(g=>{if(!map.hasLayer(g))map.addLayer(g)});const sCount=filtered.filter(s=>s.type==='sukiya').length,bCount=filtered.length-sCount;$('count').textContent=`表示 ${filtered.length.toLocaleString()}店（すき家 ${sCount.toLocaleString()} / ビッグエコー ${bCount.toLocaleString()}）`;$('status').textContent=filtered.length?`表示 ${filtered.length.toLocaleString()}店。地図をクリックすると中心座標を取得できます。`:'該当する店舗がありません';if(filtered.length&&pref){const bounds=L.latLngBounds(filtered.map(s=>[s.lat,s.lon]));map.fitBounds(bounds,{padding:[30,30],maxZoom:15});}}
  function drawRadius(){let lat=Number($('lat').value),lon=Number($('lon').value),r=Number($('radius').value);const input=$('centerStore').value.trim();if(input){const s=STORES.find(x=>`${x.name}｜${x.address}`===input)||STORES.find(x=>x.name===input);if(s){lat=s.lat;lon=s.lon;$('lat').value=lat;$('lon').value=lon;}}if(!Number.isFinite(lat)||!Number.isFinite(lon)||!Number.isFinite(r)||r<=0){$('status').textContent='中心座標と正の半径を入力してください';return;}if(circle)map.removeLayer(circle);if(centerMarker)map.removeLayer(centerMarker);circle=L.circle([lat,lon],{radius:r,color:'#6a3dad',fillColor:'#8e62c7',fillOpacity:.14,weight:2}).addTo(map);centerMarker=L.circleMarker([lat,lon],{radius:5,color:'#51258c',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(map);map.fitBounds(circle.getBounds(),{padding:[24,24]});$('status').textContent=`半径 ${r.toLocaleString()}m を表示中`;}
  [...new Set(STORES.map(s=>s.pref))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(p=>{$('pref').insertAdjacentHTML('beforeend',`<option>${esc(p)}</option>`)});
  STORES.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(s=>$('storeList').insertAdjacentHTML('beforeend',`<option value="${esc(s.name)}｜${esc(s.address)}"></option>`));
  $('showSukiya').onchange=apply;$('showBE').onchange=apply;$('pref').onchange=apply;$('drawRadius').onclick=drawRadius;$('clearRadius').onclick=()=>{if(circle)map.removeLayer(circle);if(centerMarker)map.removeLayer(centerMarker);circle=centerMarker=null;$('status').textContent='円を消しました'};$('centerStore').addEventListener('change',()=>{const s=STORES.find(x=>`${x.name}｜${x.address}`===$('centerStore').value);if(s){$('lat').value=s.lat;$('lon').value=s.lon;}});map.on('click',e=>{$('centerStore').value='';$('lat').value=e.latlng.lat.toFixed(7);$('lon').value=e.latlng.lng.toFixed(7);if(centerMarker)map.removeLayer(centerMarker);centerMarker=L.circleMarker(e.latlng,{radius:5,color:'#51258c',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(map);$('status').textContent=`中心座標を取得しました：${e.latlng.lat.toFixed(7)}, ${e.latlng.lng.toFixed(7)}`;});const setMapOnly=on=>{document.body.classList.toggle('map-only',on);setTimeout(()=>map.invalidateSize(),50)};$('hideUI').onclick=()=>setMapOnly(true);$('showUI').onclick=()=>setMapOnly(false);
  apply();
})();
</script>
